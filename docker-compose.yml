version: "3.8"

services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        DEPLOY_STRATEGY: ${DEPLOY_STRATEGY:-rolling-update}
        RELEASE_COLOR: ${RELEASE_COLOR:-blue}
    image: aceest-fitness:${APP_VERSION:-1.0.0}
    ports:
      - "5000:5000"
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEPLOY_STRATEGY: ${DEPLOY_STRATEGY:-rolling-update}
      RELEASE_COLOR: ${RELEASE_COLOR:-blue}
      ACEEST_DATABASE: /data/aceest_fitness.db
    volumes:
      - aceest-data:/data
    restart: unless-stopped

  sonarqube:
    image: sonarqube:10-community
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-change-me}
    depends_on:
      - sonar-db
    restart: unless-stopped

  sonar-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-change-me}
      POSTGRES_DB: sonar
    volumes:
      - sonar-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  aceest-data:
  sonar-data:
